<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>ROACH SMASH! — Camera Edition</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #151322;
      color: white;
      font-family: Arial, sans-serif;
    }

    #camera,
    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #camera {
      object-fit: cover;
      background: #151322;
    }

    #game {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: calc(12px + env(safe-area-inset-top)) 14px 12px;
      background: rgba(20, 15, 35, 0.78);
      font-size: clamp(16px, 4vw, 26px);
      font-weight: bold;
      pointer-events: none;
    }

    #message {
      position: fixed;
      top: 22%;
      left: 50%;
      z-index: 3;
      transform: translateX(-50%);
      padding: 8px 16px;
      border-radius: 12px;
      background: rgba(20, 15, 35, 0.85);
      color: #ffda4b;
      font-size: 26px;
      font-weight: bold;
      pointer-events: none;
      opacity: 0;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(17, 13, 29, 0.84);
      text-align: center;
    }

    #panel {
      width: min(100%, 440px);
    }

    h1 {
      margin: 0 0 16px;
      color: #ffda4b;
      font-size: clamp(36px, 9vw, 64px);
    }

    p {
      line-height: 1.45;
    }

    #status {
      min-height: 48px;
    }

    button {
      min-width: 200px;
      min-height: 60px;
      padding: 12px 24px;
      border: 0;
      border-radius: 14px;
      background: #64c77a;
      color: #161323;
      font-size: 23px;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <video id="camera" autoplay muted playsinline></video>

  <canvas
    id="game"
    aria-label="Swipe across cockroaches over the camera view"
  ></canvas>

  <div id="hud">
    <span id="score">Score: 0</span>
    <span id="timer">60s</span>
    <span id="lives">Lives: 3</span>
  </div>

  <div id="message"></div>

  <div id="overlay">
    <div id="panel">
      <h1 id="panel-title">ROACH SMASH!</h1>
      <p id="panel-description">
        Find the roaches scattered over your camera view.
        Swipe quickly across them to smash them!
      </p>
      <p id="status">
        Tap START and allow camera access.
      </p>
      <button id="start-button" type="button">START</button>
    </div>
  </div>

  <script>
    "use strict";

    const video = document.getElementById("camera");
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const overlay = document.getElementById("overlay");
    const panelTitle = document.getElementById("panel-title");
    const panelDescription = document.getElementById("panel-description");
    const statusText = document.getElementById("status");
    const startButton = document.getElementById("start-button");

    const scoreText = document.getElementById("score");
    const timerText = document.getElementById("timer");
    const livesText = document.getElementById("lives");
    const message = document.getElementById("message");

    const ROUND_SECONDS = 60;
    const STARTING_LIVES = 3;
    const SPAWN_INTERVAL = 4.2;
    const MAX_ROACHES = 12;
    const HIT_COOLDOWN_MS = 300;
    const MAX_SAMPLE_GAP_MS = 180;
    const SPLAT_DURATION_MS = 450;
    const SCATTER_DURATION = 0.65;

    // Upload roach.png beside this HTML file.
    const roachImage = new Image();
    let roachImageReady = false;

    roachImage.onload = () => {
      roachImageReady = true;
    };

    roachImage.onerror = () => {
      console.warn(
        "Could not load roach.png. Check its filename and repository location."
      );
    };

    roachImage.src = "roach.png";

    let width = 0;
    let height = 0;
    let stream = null;
    let state = "start";

    let score = 0;
    let lives = STARTING_LIVES;
    let secondsLeft = ROUND_SECONDS;
    let spawnClock = 0;
    let roaches = [];
    let splats = [];

    let activePointerId = null;
    let previousPoint = null;
    let previousTime = null;
    let swingUsed = false;
    let lastHit = -HIT_COOLDOWN_MS;
    let messageUntil = 0;
    let lastFrame = performance.now();

    function resize() {
      const oldWidth = width;
      const oldHeight = height;

      width = window.innerWidth;
      height = window.innerHeight;

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (oldWidth && oldHeight) {
        for (const roach of roaches) {
          roach.x *= width / oldWidth;
          roach.y *= height / oldHeight;
          roach.vx *= width / oldWidth;
          roach.vy *= height / oldHeight;
          roach.homeVx *= width / oldWidth;
          roach.homeVy *= height / oldHeight;
        }

        for (const splat of splats) {
          splat.x *= width / oldWidth;
          splat.y *= height / oldHeight;
        }
      }

      previousPoint = null;
      previousTime = null;
    }

    window.addEventListener("resize", resize);
    resize();

    function playTop() {
      return Math.min(120, height * 0.22);
    }

    function roachRadius() {
      return Math.max(18, Math.min(width, height) * 0.043);
    }

    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    function updateHud() {
      scoreText.textContent = `Score: ${score}`;
      timerText.textContent = `${Math.ceil(secondsLeft)}s`;
      livesText.textContent = `Lives: ${Math.max(0, lives)}`;
    }

    function spawnSwarm() {
      const available = MAX_ROACHES - roaches.length;
      if (available <= 0) return;

      const radius = roachRadius();
      const top = playTop();
      const bottom = height - radius * 2;

      if (width < radius * 4 || bottom <= top + radius * 2) {
        return;
      }

      // Distribute new roaches across screen regions rather than
      // sending them all in from one edge.
      const count = Math.min(
        available,
        Math.floor(randomBetween(3, 6))
      );
      const columns = Math.ceil(Math.sqrt(count));
      const rows = Math.ceil(count / columns);
      const cellWidth = width / columns;
      const cellHeight = (bottom - top) / rows;

      for (let i = 0; i < count; i++) {
        const column = i % columns;
        const row = Math.floor(i / columns);

        const x = Math.max(
          radius,
          Math.min(
            width - radius,
            (column + randomBetween(0.25, 0.75)) * cellWidth
          )
        );

        const y = Math.max(
          top + radius,
          Math.min(
            bottom - radius,
            top + (row + randomBetween(0.25, 0.75)) * cellHeight
          )
        );

        const angle = randomBetween(0, Math.PI * 2);
        const speed = Math.max(
          35,
          Math.min(width, height) * randomBetween(0.09, 0.15)
        );
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;

        roaches.push({
          x,
          y,
          vx,
          vy,
          homeVx: vx,
          homeVy: vy,
          scatterLeft: 0,
          age: 0,
          golden: Math.random() < 0.15
        });
      }
    }

    async function startCamera() {
      if (stream) return;

      if (
        !window.isSecureContext ||
        !navigator.mediaDevices?.getUserMedia
      ) {
        throw new Error(
          "Camera access requires HTTPS and a supported browser. " +
          "Open the GitHub Pages link directly on your device."
        );
      }

      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: "environment" }
        }
      });

      video.srcObject = stream;
      await video.play();
    }

    function startGame() {
      state = "playing";
      score = 0;
      lives = STARTING_LIVES;
      secondsLeft = ROUND_SECONDS;
      spawnClock = 0;
      roaches = [];
      splats = [];
      activePointerId = null;
      previousPoint = null;
      previousTime = null;
      swingUsed = false;
      lastHit = -HIT_COOLDOWN_MS;
      message.style.opacity = "0";

      spawnSwarm();
      updateHud();
      overlay.classList.add("hidden");
    }

    function endGame() {
      if (state !== "playing") return;

      state = "gameover";
      panelTitle.textContent = "GAME OVER!";
      panelDescription.textContent =
        `Final score: ${score}. Tap below to play again.`;
      statusText.textContent =
        "Roaches are overlaid on the camera view, not anchored to the room.";
      startButton.textContent = "PLAY AGAIN";
      overlay.classList.remove("hidden");
    }

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      statusText.textContent = "Opening camera...";

      try {
        await startCamera();
        startGame();
      } catch (error) {
        console.error(error);
        statusText.textContent =
          `Camera could not start: ${error.message}`;
        startButton.textContent = "TRY AGAIN";
      } finally {
        startButton.disabled = false;
      }
    });

    function pointFromEvent(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
    }

    function distanceToSegment(point, a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const lengthSquared = dx * dx + dy * dy;

      if (lengthSquared === 0) {
        return Math.hypot(
          point.x - a.x,
          point.y - a.y
        );
      }

      const amount = Math.max(
        0,
        Math.min(
          1,
          (
            (point.x - a.x) * dx +
            (point.y - a.y) * dy
          ) / lengthSquared
        )
      );

      return Math.hypot(
        point.x - (a.x + amount * dx),
        point.y - (a.y + amount * dy)
      );
    }

    function scatterNearby(hitX, hitY) {
      const range = roachRadius() * 6;
      const impulse = Math.max(
        90,
        Math.min(width, height) * 0.38
      );

      for (const roach of roaches) {
        const dx = roach.x - hitX;
        const dy = roach.y - hitY;
        const distance = Math.hypot(dx, dy);

        if (distance >= range) continue;

        const angle = distance < 1
          ? randomBetween(0, Math.PI * 2)
          : Math.atan2(dy, dx);

        const strength = impulse * (1 - distance / range);
        roach.vx = roach.homeVx + Math.cos(angle) * strength;
        roach.vy = roach.homeVy + Math.sin(angle) * strength;
        roach.scatterLeft = SCATTER_DURATION;
      }
    }

    canvas.addEventListener("pointerdown", (event) => {
      if (state !== "playing" || activePointerId !== null) return;

      event.preventDefault();
      activePointerId = event.pointerId;
      canvas.setPointerCapture(event.pointerId);
      previousPoint = pointFromEvent(event);
      previousTime = performance.now();
      swingUsed = false;
    });

    canvas.addEventListener("pointermove", (event) => {
      if (
        state !== "playing" ||
        event.pointerId !== activePointerId
      ) {
        return;
      }

      event.preventDefault();

      const current = pointFromEvent(event);
      const now = performance.now();

      if (previousPoint === null || previousTime === null) {
        previousPoint = current;
        previousTime = now;
        return;
      }

      const elapsedMs = now - previousTime;

      if (
        elapsedMs <= 0 ||
        elapsedMs > MAX_SAMPLE_GAP_MS
      ) {
        previousPoint = current;
        previousTime = now;
        return;
      }

      const movement = Math.hypot(
        current.x - previousPoint.x,
        current.y - previousPoint.y
      );
      const speed = movement / (elapsedMs / 1000);
      const minimumSpeed = Math.max(
        300,
        Math.min(width, height) * 1.8
      );

      if (
        !swingUsed &&
        speed >= minimumSpeed &&
        now - lastHit >= HIT_COOLDOWN_MS
      ) {
        for (let i = 0; i < roaches.length; i++) {
          const roach = roaches[i];

          if (
            roach.x < 0 ||
            roach.x > width ||
            roach.y < playTop() ||
            roach.y > height
          ) {
            continue;
          }

          if (
            distanceToSegment(
              roach,
              previousPoint,
              current
            ) <= roachRadius() + 14
          ) {
            const points = roach.golden ? 30 : 10;
            const hitX = roach.x;
            const hitY = roach.y;
            const golden = roach.golden;

            score += points;
            lastHit = now;
            swingUsed = true;
            roaches.splice(i, 1);

            splats.push({
              x: hitX,
              y: hitY,
              golden,
              started: now
            });

            scatterNearby(hitX, hitY);

            message.textContent = `+${points} SMASH!`;
            message.style.opacity = "1";
            messageUntil = now + 400;
            updateHud();
            break;
          }
        }
      }

      previousPoint = current;
      previousTime = now;
    });

    function releasePointer(event) {
      if (event.pointerId !== activePointerId) return;

      activePointerId = null;
      previousPoint = null;
      previousTime = null;
      swingUsed = false;
    }

    canvas.addEventListener("pointerup", releasePointer);
    canvas.addEventListener("pointercancel", releasePointer);
    canvas.addEventListener("lostpointercapture", releasePointer);

    function drawRoach(roach) {
      const radius = roachRadius();
      const diameter = radius * 2;
      const x = roach.x;
      const y = roach.y;

      if (roach.golden) {
        ctx.fillStyle = "rgba(255, 218, 75, 0.75)";
        ctx.beginPath();
        ctx.arc(x, y, radius * 1.17, 0, Math.PI * 2);
        ctx.fill();
      }

      if (roachImageReady) {
        // Rotate the artwork to face the direction of movement.
        // If your PNG already faces right, change the -Math.PI / 2
        // below to 0.
        const angle = Math.atan2(roach.vy, roach.vx) - Math.PI / 2;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        if (roach.golden) {
          ctx.filter = "sepia(1) saturate(5) hue-rotate(350deg)";
        }

        ctx.drawImage(
          roachImage,
          -radius,
          -radius,
          diameter,
          diameter
        );

        ctx.restore();
      } else {
        // Placeholder remains visible if the image has not loaded.
        ctx.fillStyle = roach.golden ? "#ffda4b" : "#bc6843";
        ctx.beginPath();
        ctx.arc(x, y, radius * 0.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawSplat(splat, now) {
      const progress =
        (now - splat.started) / SPLAT_DURATION_MS;

      if (progress < 0 || progress >= 1) return;

      ctx.strokeStyle = splat.golden
        ? "#ffda4b"
        : "#ff6973";
      ctx.lineWidth = Math.max(
        1,
        5 * (1 - progress)
      );

      ctx.beginPath();
      ctx.arc(
        splat.x,
        splat.y,
        12 + progress * 45,
        0,
        Math.PI * 2
      );
      ctx.stroke();
    }

    function frame(now) {
      const dt = Math.min(
        (now - lastFrame) / 1000,
        0.05
      );
      lastFrame = now;

      if (state === "playing" && !document.hidden) {
        secondsLeft = Math.max(
          0,
          secondsLeft - dt
        );
        spawnClock += dt;

        while (spawnClock >= SPAWN_INTERVAL) {
          spawnClock -= SPAWN_INTERVAL;
          spawnSwarm();
        }

        for (let i = roaches.length - 1; i >= 0; i--) {
          const roach = roaches[i];
          roach.age += dt;

          if (roach.scatterLeft > 0) {
            roach.scatterLeft = Math.max(
              0,
              roach.scatterLeft - dt
            );

            const recovery = Math.min(1, dt * 2.7);
            roach.vx +=
              (roach.homeVx - roach.vx) * recovery;
            roach.vy +=
              (roach.homeVy - roach.vy) * recovery;
          } else {
            const wiggle =
              Math.sin(roach.age * 5 + i) * dt * 9;

            if (
              Math.abs(roach.homeVx) >
              Math.abs(roach.homeVy)
            ) {
              roach.y += wiggle;
            } else {
              roach.x += wiggle;
            }
          }

          roach.x += roach.vx * dt;
          roach.y += roach.vy * dt;

          const margin = roachRadius() * 1.5;

          if (
            roach.x < -margin ||
            roach.x > width + margin ||
            roach.y < playTop() - margin ||
            roach.y > height + margin
          ) {
            roaches.splice(i, 1);
            lives -= 1;
          }
        }

        splats = splats.filter(
          splat =>
            now - splat.started < SPLAT_DURATION_MS
        );

        if (now >= messageUntil) {
          message.style.opacity = "0";
        }

        updateHud();

        if (secondsLeft <= 0 || lives <= 0) {
          endGame();
        }
      }

      ctx.clearRect(0, 0, width, height);

      if (state === "playing") {
        for (const roach of roaches) {
          drawRoach(roach);
        }

        for (const splat of splats) {
          drawSplat(splat, now);
        }
      }

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);

    window.addEventListener("pagehide", () => {
      if (stream) {
        for (const track of stream.getTracks()) {
          track.stop();
        }
        stream = null;
      }
    });
  </script>
</body>
</html>
